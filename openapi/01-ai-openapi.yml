openapi: 3.1.0
info:
  title: Lingyiwanwu Platform API
  version: '1.0'
  description: >-
    OpenAI-compatible inference API for the Yi family of large language models from
    01.AI. Available models include Yi-Lightning, Yi-Lightning-Lite, Yi-Large,
    Yi-Large-Turbo, and Yi-Vision. The wire protocol mirrors the OpenAI Chat
    Completions API; only endpoints explicitly documented by 01.AI as available are
    listed below.
  contact:
    name: 01.AI Lingyiwanwu Platform
    url: https://platform.lingyiwanwu.com/docs
servers:
  - url: https://api.lingyiwanwu.com/v1
    description: Lingyiwanwu inference endpoint (OpenAI-compatible)
tags:
  - name: Chat
    description: OpenAI-compatible chat completions for Yi text and vision models.
paths:
  /chat/completions:
    post:
      tags:
        - Chat
      summary: Create a chat completion using a Yi model
      description: >-
        OpenAI-compatible chat completions endpoint. Accepts a model identifier
        (e.g. yi-lightning, yi-large, yi-vision) and a list of messages.
      responses:
        '200':
          description: Successful chat completion
        '401':
          description: Unauthorized
      security:
        - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API key passed as a Bearer token in the Authorization header.
