description: >-
  01.AI publishes pay-as-you-go per-token pricing on the Lingyiwanwu open platform. Yi-Lightning
  is the flagship at approximately $0.14 per million tokens; Yi-Lightning-Lite is cheaper.
  Yi open-source weights are also available for self-hosting.
notes: >-
  Documentation portal is primarily Chinese; rates and exact tiers vary across Yi-Large,
  Yi-Large-Turbo, Yi-Lightning, and Yi-Lightning-Lite. Verify current rates on the Lingyiwanwu
  console.
